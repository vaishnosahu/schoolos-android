name: Temporary Messenger Live APK

on:
  push:
    branches:
      - temp-messenger-live-apk
    paths:
      - ".github/workflows/temp-messenger-live-apk.yml"
      - "messenger-build/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4

      - name: Reassemble and verify Messenger source
        shell: bash
        run: |
          set -euo pipefail
          cat messenger-build/parts/part*.b64 > /tmp/messenger-source.b64
          test "$(wc -c < /tmp/messenger-source.b64)" -eq 66680
          base64 --decode /tmp/messenger-source.b64 > /tmp/Messenger-Android-Live-API-Source.zip
          echo "b022db7848ffcaf1b75fba5983b5bfff2f730384ead2d88de0f3e2a0716bbd2d  /tmp/Messenger-Android-Live-API-Source.zip" | sha256sum -c -
          unzip -q /tmp/Messenger-Android-Live-API-Source.zip -d "$GITHUB_WORKSPACE/build-input"
          test -f "$GITHUB_WORKSPACE/build-input/messenger_live/app/build.gradle.kts"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$GITHUB_WORKSPACE/build-input/messenger_live" :app:assembleDebug --stacktrace
          test -f "$GITHUB_WORKSPACE/build-input/messenger_live/app/build/outputs/apk/debug/app-debug.apk"
          cp "$GITHUB_WORKSPACE/build-input/messenger_live/app/build/outputs/apk/debug/app-debug.apk" "$GITHUB_WORKSPACE/Messenger-Live-API-Debug.apk"
          sha256sum "$GITHUB_WORKSPACE/Messenger-Live-API-Debug.apk"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Messenger-Live-API-Debug-APK
          path: Messenger-Live-API-Debug.apk
          if-no-files-found: error
          retention-days: 1
