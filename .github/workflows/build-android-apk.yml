name: Build SchoolOS Full Native R5
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed native live APK
        run: gradle --no-daemon clean assembleRelease

      - name: Verify APK contract
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          "$AAPT" dump permissions "$APK" | tee apk-permissions.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          grep -q "package: name='com.schooloss.nativeapp'" apk-badging.txt
          grep -q "sdkVersion:'24'" apk-badging.txt
          grep -q "targetSdkVersion:'35'" apk-badging.txt
          grep -q "android.permission.INTERNET" apk-permissions.txt
          grep -q "android.permission.ACCESS_NETWORK_STATE" apk-permissions.txt
          if grep -E "CAMERA|RECORD_AUDIO|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|READ_CONTACTS|WRITE_EXTERNAL_STORAGE|READ_EXTERNAL_STORAGE" apk-permissions.txt; then
            echo "::error::Unexpected sensitive permission in R2"
            exit 1
          fi
          cp "$APK" SchoolOS-Full-Native-R5.apk
          sha256sum SchoolOS-Full-Native-R5.apk > apk-sha256.txt

          if grep -R --include='*.java' --include='*.kt' -n -E 'android\\.webkit\\.WebView|WebViewClient|androidx\\.webkit' app/src/main/java; then
            echo "::error::Application source contains a WebView implementation"
            exit 1
          fi

          find app/src/main/java -type f \( -name '*.java' -o -name '*.kt' \) | sort > native-source-files.txt
          test "$(wc -l < native-source-files.txt)" -ge 10

          zip -qr SchoolOS-Full-Native-R5-Source.zip \
            app/src \
            app/build.gradle \
            app/proguard-rules.pro \
            build.gradle \
            settings.gradle \
            gradle.properties \
            README.md
          sha256sum SchoolOS-Full-Native-R5-Source.zip > source-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: SchoolOS-Full-Native-R5
          path: |
            SchoolOS-Full-Native-R5.apk
            apk-badging.txt
            apk-permissions.txt
            apk-signature.txt
            apk-sha256.txt
            SchoolOS-Full-Native-R5-Source.zip
            native-source-files.txt
            source-sha256.txt
          if-no-files-found: error
