name: Messenger v2.26.52 Call Crash Isolation

on:
  push:
    branches: [ messenger-call-crash-isolation-22652-20261007 ]

permissions:
  contents: read
  actions: read

jobs:
  call-crash-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android API 36
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Download verified answer-crash-hotfix source
        uses: actions/download-artifact@v4
        with:
          name: Messenger-v2.26.52-Answer-Crash-Hotfix-Source
          path: /tmp/answer-hotfix-artifact
          repository: vaishnosahu/schoolos-android
          run-id: 37576209925
          github-token: ${{ github.token }}

      - name: Reconstruct verified baseline
        shell: bash
        run: |
          rm -rf /tmp/messenger-build
          mkdir -p /tmp/messenger-build
          SRCZIP="$(find /tmp/answer-hotfix-artifact -type f -name 'Messenger-v2.26.52-Answer-Crash-Hotfix-Source.zip' | head -1)"
          test -s "$SRCZIP"
          unzip -tq "$SRCZIP"
          unzip -q "$SRCZIP" -d /tmp/messenger-build
          test -f /tmp/messenger-build/settings.gradle.kts
          echo "70936527fda20b5aa9f2cc8274919f859783eaa8da679f0ee3a52fbe04729e2c  /tmp/messenger-build/app/src/main/java/com/example/messengerui/AppViewModel.kt" | sha256sum -c -
          echo "ec3fd05f32212aafaf19738c3519aa92540a957be212c9c78dbdf0047f2d1c86  /tmp/messenger-build/app/src/main/java/com/example/messengerui/WebRtcVoiceEngine.kt" | sha256sum -c -
          echo "9333b5698a006dc29d4c94976856aebe175ed9a2fe0a40b110ab3a0cfda4bfe6  /tmp/messenger-build/app/src/main/java/com/example/messengerui/ProcessExitDiagnostics.kt" | sha256sum -c -

      - name: RED - reproduce remaining crash blind spots
        shell: bash
        run: |
          cd /tmp/messenger-build
          python3 - <<'PY'
          from pathlib import Path
          root=Path('app/src/main/java/com/example/messengerui')
          vm=(root/'AppViewModel.kt').read_text()
          we=(root/'WebRtcVoiceEngine.kt').read_text()
          pd=(root/'ProcessExitDiagnostics.kt').read_text()
          failures=[]
          if 'private object MessengerWebRtcRuntime' in we: failures.append('senior process-wide WebRTC init still active')
          if '.remove(KEY_CRASH)' in pd: failures.append('next launch wipes stored Java crash detail')
          if 'KEY_CALL_STAGE' not in pd: failures.append('no persisted call crash breadcrumb')
          if 'answer_before_engine' not in vm: failures.append('answer path has no engine boundary breadcrumb')
          if not failures:
              raise SystemExit('ERROR: RED test unexpectedly passed')
          print('EXPECTED_RED:', '; '.join(failures))
          PY

      - name: Apply crash isolation transform
        shell: bash
        run: |
          cd /tmp/messenger-build
          python3 "$GITHUB_WORKSPACE/tmp-messenger-build/apply_call_crash_isolation.py"
          echo "d4f236160e94ff16b6289e4643bdd785c85b1585b64645ea37a575e635e04089  app/src/main/java/com/example/messengerui/AppViewModel.kt" | sha256sum -c -
          echo "2447fd942f5c68912cfcde384d6882d9c2b014fdd531a64bb76f145d824587ef  app/src/main/java/com/example/messengerui/WebRtcVoiceEngine.kt" | sha256sum -c -
          echo "f27d921e596bdf7c9df5c5ebce5bc035e0d5d3277ca1826c420e42cb3cadb096  app/src/main/java/com/example/messengerui/ProcessExitDiagnostics.kt" | sha256sum -c -

      - name: GREEN - verify rollback and crash breadcrumbs
        shell: bash
        run: |
          cd /tmp/messenger-build
          python3 - <<'PY'
          from pathlib import Path
          root=Path('app/src/main/java/com/example/messengerui')
          vm=(root/'AppViewModel.kt').read_text()
          we=(root/'WebRtcVoiceEngine.kt').read_text()
          pd=(root/'ProcessExitDiagnostics.kt').read_text()
          assert 'private object MessengerWebRtcRuntime' not in we
          assert 'PeerConnectionFactory.initialize(PeerConnectionFactory.InitializationOptions.builder(appContext).createInitializationOptions())' in we
          assert 'enum class SignalApplyResult { APPLIED, IGNORED, DEFERRED, FAILED }' in we
          assert 'remote_ice_apply_deferred' in we
          assert 'answer_before_engine' in vm and 'answer_after_engine' in vm
          assert 'answer_before_foreground_service' in vm and 'answer_after_foreground_service' in vm
          assert 'KEY_CALL_STAGE' in pd
          assert '.remove(KEY_CRASH)' not in pd
          assert 'stage ${stage.take(80)}' in pd
          print('PASS: senior ACK/ICE fixes retained; process-wide init rollback applied; crash boundary persists across restart')
          PY

      - name: Build debug APK
        working-directory: /tmp/messenger-build
        run: gradle --no-daemon clean assembleDebug

      - name: Run Android lint
        working-directory: /tmp/messenger-build
        run: gradle --no-daemon :app:lintDebug

      - name: Verify debug APK
        shell: bash
        run: |
          APK=/tmp/messenger-build/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" | tee crash-isolation-debug-badging.txt
          grep -q "package: name='com.example.messengerui'" crash-isolation-debug-badging.txt
          grep -q "versionName='2.26.52'" crash-isolation-debug-badging.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee crash-isolation-debug-apksigner.txt

      - name: Build and sign stable APK
        shell: bash
        run: |
          cd /tmp/messenger-build
          gradle --no-daemon assembleRelease
          UNSIGNED="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -1)"
          test -s "$UNSIGNED"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -s "$GITHUB_WORKSPACE/schoolos-stable-debug.keystore"
          "$ZIPALIGN" -f -p 4 "$UNSIGNED" "$GITHUB_WORKSPACE/Messenger-v2.26.52-Call-Crash-Isolation-aligned.apk"
          "$APKSIGNER" sign --ks "$GITHUB_WORKSPACE/schoolos-stable-debug.keystore" --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android --out "$GITHUB_WORKSPACE/Messenger-v2.26.52-Call-Crash-Isolation.apk" "$GITHUB_WORKSPACE/Messenger-v2.26.52-Call-Crash-Isolation-aligned.apk"
          "$APKSIGNER" verify --verbose --print-certs "$GITHUB_WORKSPACE/Messenger-v2.26.52-Call-Crash-Isolation.apk" | tee "$GITHUB_WORKSPACE/crash-isolation-stable-apksigner.txt"
          "$AAPT" dump badging "$GITHUB_WORKSPACE/Messenger-v2.26.52-Call-Crash-Isolation.apk" | tee "$GITHUB_WORKSPACE/crash-isolation-stable-badging.txt"
          grep -q "package: name='com.example.messengerui'" "$GITHUB_WORKSPACE/crash-isolation-stable-badging.txt"
          grep -q "versionName='2.26.52'" "$GITHUB_WORKSPACE/crash-isolation-stable-badging.txt"
          sha256sum "$GITHUB_WORKSPACE/Messenger-v2.26.52-Call-Crash-Isolation.apk" | tee "$GITHUB_WORKSPACE/Messenger-v2.26.52-Call-Crash-Isolation.sha256"

      - name: Package resolved source
        shell: bash
        run: |
          cd /tmp/messenger-build
          zip -qr "$GITHUB_WORKSPACE/Messenger-v2.26.52-Call-Crash-Isolation-Source.zip" . -x '.gradle/*' '*/build/*' '.idea/*'

      - name: Upload stable APK
        uses: actions/upload-artifact@v4
        with:
          name: Messenger-v2.26.52-Call-Crash-Isolation
          path: |
            Messenger-v2.26.52-Call-Crash-Isolation.apk
            Messenger-v2.26.52-Call-Crash-Isolation.sha256
            crash-isolation-stable-badging.txt
            crash-isolation-stable-apksigner.txt
          if-no-files-found: error
          retention-days: 2

      - name: Upload resolved source
        uses: actions/upload-artifact@v4
        with:
          name: Messenger-v2.26.52-Call-Crash-Isolation-Source
          path: Messenger-v2.26.52-Call-Crash-Isolation-Source.zip
          if-no-files-found: error
          retention-days: 2
