name: Messenger v2.26.52 WebRTC Init Rollback

on:
  push:
    branches: [ messenger-webrtc-init-rollback-22652-20261007 ]

permissions:
  contents: read
  actions: read

jobs:
  webrtc-init-rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android API 36
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Download verified webrtc-init hotfix source
        uses: actions/download-artifact@v4
        with:
          name: Messenger-v2.26.52-WebRTC-Init-Rollback-Source
          path: /tmp/senior-artifact
          repository: vaishnosahu/schoolos-android
          run-id: 37576209925
          github-token: ${{ github.token }}

      - name: Reconstruct verified webrtc-init baseline
        shell: bash
        run: |
          rm -rf /tmp/messenger-build
          mkdir -p /tmp/messenger-build
          SRCZIP="$(find /tmp/senior-artifact -type f -name 'Messenger-v2.26.52-WebRTC-Init-Rollback-Source.zip' | head -1)"
          test -s "$SRCZIP"
          unzip -tq "$SRCZIP"
          unzip -q "$SRCZIP" -d /tmp/messenger-build
          test -f /tmp/messenger-build/settings.gradle.kts
          echo "70936527fda20b5aa9f2cc8274919f859783eaa8da679f0ee3a52fbe04729e2c  /tmp/messenger-build/app/src/main/java/com/example/messengerui/AppViewModel.kt" | sha256sum -c -
          echo "ec3fd05f32212aafaf19738c3519aa92540a957be212c9c78dbdf0047f2d1c86  /tmp/messenger-build/app/src/main/java/com/example/messengerui/WebRtcVoiceEngine.kt" | sha256sum -c -

      - name: RED - reproduce senior WebRTC init regression
        shell: bash
        run: |
          cd /tmp/messenger-build
          python3 - <<'PY'
          from pathlib import Path
          we=Path('app/src/main/java/com/example/messengerui/WebRtcVoiceEngine.kt').read_text()
          assert 'private object MessengerWebRtcRuntime' in we
          assert 'MessengerWebRtcRuntime.ensureInitialized(appContext)' in we
          print('EXPECTED_RED: senior process-global WebRTC init wrapper present')
          PY

      - name: Apply WebRTC init rollback
        shell: bash
        run: |
          cd /tmp/messenger-build
          python3 "$GITHUB_WORKSPACE/tmp-messenger-build/apply_webrtc_init_rollback.py"
          echo "70936527fda20b5aa9f2cc8274919f859783eaa8da679f0ee3a52fbe04729e2c  app/src/main/java/com/example/messengerui/AppViewModel.kt" | sha256sum -c -
          echo "410d17e554da77d2e85a272833620dffbb4f8ac6823f71792abe60569452094b  app/src/main/java/com/example/messengerui/WebRtcVoiceEngine.kt" | sha256sum -c -

      - name: GREEN - verify known-working WebRTC initialization
        shell: bash
        run: |
          cd /tmp/messenger-build
          python3 - <<'PY'
          from pathlib import Path
          vm=Path('app/src/main/java/com/example/messengerui/AppViewModel.kt').read_text()
          we=Path('app/src/main/java/com/example/messengerui/WebRtcVoiceEngine.kt').read_text()
          assert 'private object MessengerWebRtcRuntime' not in we
          assert 'MessengerWebRtcRuntime.ensureInitialized(appContext)' not in we
          assert 'PeerConnectionFactory.initialize(PeerConnectionFactory.InitializationOptions.builder(appContext).createInitializationOptions())' in we
          assert 'signal_deferred_until_answer' in vm
          assert 'private var applyingRemoteSignalId: Long? = null' in vm
          print('PASS: known-working engine initialization restored; crash-safe answer sequencing retained')
          PY

      - name: Build debug APK
        working-directory: /tmp/messenger-build
        run: gradle --no-daemon clean assembleDebug

      - name: Run Android lint
        working-directory: /tmp/messenger-build
        run: gradle --no-daemon :app:lintDebug

      - name: Verify debug APK
        shell: bash
        run: |
          APK=/tmp/messenger-build/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" | tee webrtc-init-debug-badging.txt
          grep -q "package: name='com.example.messengerui'" webrtc-init-debug-badging.txt
          grep -q "versionName='2.26.52'" webrtc-init-debug-badging.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee webrtc-init-debug-apksigner.txt

      - name: Build and sign stable APK
        shell: bash
        run: |
          cd /tmp/messenger-build
          gradle --no-daemon assembleRelease
          UNSIGNED="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -1)"
          test -s "$UNSIGNED"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -s "$GITHUB_WORKSPACE/schoolos-stable-debug.keystore"
          "$ZIPALIGN" -f -p 4 "$UNSIGNED" "$GITHUB_WORKSPACE/Messenger-v2.26.52-WebRTC-Init-Rollback-aligned.apk"
          "$APKSIGNER" sign --ks "$GITHUB_WORKSPACE/schoolos-stable-debug.keystore" --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android --out "$GITHUB_WORKSPACE/Messenger-v2.26.52-WebRTC-Init-Rollback.apk" "$GITHUB_WORKSPACE/Messenger-v2.26.52-WebRTC-Init-Rollback-aligned.apk"
          "$APKSIGNER" verify --verbose --print-certs "$GITHUB_WORKSPACE/Messenger-v2.26.52-WebRTC-Init-Rollback.apk" | tee "$GITHUB_WORKSPACE/webrtc-init-stable-apksigner.txt"
          "$AAPT" dump badging "$GITHUB_WORKSPACE/Messenger-v2.26.52-WebRTC-Init-Rollback.apk" | tee "$GITHUB_WORKSPACE/webrtc-init-stable-badging.txt"
          grep -q "package: name='com.example.messengerui'" "$GITHUB_WORKSPACE/webrtc-init-stable-badging.txt"
          grep -q "versionName='2.26.52'" "$GITHUB_WORKSPACE/webrtc-init-stable-badging.txt"
          sha256sum "$GITHUB_WORKSPACE/Messenger-v2.26.52-WebRTC-Init-Rollback.apk" | tee "$GITHUB_WORKSPACE/Messenger-v2.26.52-WebRTC-Init-Rollback.sha256"

      - name: Package resolved source
        shell: bash
        run: |
          cd /tmp/messenger-build
          zip -qr "$GITHUB_WORKSPACE/Messenger-v2.26.52-WebRTC-Init-Rollback-Source.zip" . -x '.gradle/*' '*/build/*' '.idea/*'

      - name: Upload stable APK
        uses: actions/upload-artifact@v4
        with:
          name: Messenger-v2.26.52-WebRTC-Init-Rollback
          path: |
            Messenger-v2.26.52-WebRTC-Init-Rollback.apk
            Messenger-v2.26.52-WebRTC-Init-Rollback.sha256
            webrtc-init-stable-badging.txt
            webrtc-init-stable-apksigner.txt
          if-no-files-found: error
          retention-days: 2

      - name: Upload resolved source
        uses: actions/upload-artifact@v4
        with:
          name: Messenger-v2.26.52-WebRTC-Init-Rollback-Source
          path: Messenger-v2.26.52-WebRTC-Init-Rollback-Source.zip
          if-no-files-found: error
          retention-days: 2
