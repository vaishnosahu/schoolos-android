name: Temporary Messenger Send Sync Fix APK Build

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ temp-messenger-notifications-build-20261001 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  messenger-notifications:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.head_ref == 'temp-messenger-notifications-build-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android API 36 using runner SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Reconstruct and verify Messenger source
        shell: bash
        run: |
          rm -rf /tmp/messenger-build
          mkdir -p /tmp/messenger-build
          cat tmp-messenger-build/notify-b64/part-* > /tmp/messenger-source.b64
          base64 --decode /tmp/messenger-source.b64 > /tmp/Messenger-Android-Notifications-Background-CI-Source.zip
          echo "d4b8ea54dae46c46e7dddcaaef02b86f01486592420077b51f130cf42e56dfec  /tmp/Messenger-Android-Notifications-Background-CI-Source.zip" | sha256sum -c -
          unzip -tq /tmp/Messenger-Android-Notifications-Background-CI-Source.zip
          unzip -q /tmp/Messenger-Android-Notifications-Background-CI-Source.zip -d /tmp/messenger-build
          test -f /tmp/messenger-build/messenger_live/settings.gradle.kts
          cp schoolos-stable-debug.keystore /tmp/messenger-build/messenger_live/messenger-stable-debug.keystore

      - name: Apply compile and send-sync regression closure
        shell: bash
        run: |
          find /tmp/messenger-build/messenger_live/app/src/main/java -name '*.kt' -type f -exec sed -i \
            -e 's/setNotificationsMessagesEnabled/updateNotificationsMessagesEnabled/g' \
            -e 's/setNotificationsGroupsEnabled/updateNotificationsGroupsEnabled/g' \
            -e 's/setNotificationsStatusEnabled/updateNotificationsStatusEnabled/g' \
            -e 's/setNotificationPreviewMode/updateNotificationPreviewMode/g' {} +

          python3 - <<'PY'
          from pathlib import Path

          root = Path("/tmp/messenger-build/messenger_live")
          vm = root / "app/src/main/java/com/example/messengerui/AppViewModel.kt"
          s = vm.read_text()
          s = s.replace(
          """    init {
                  runCatching { connectivityManager.registerDefaultNetworkCallback(networkCallback) }
                  if (serverMode) startServerSync()
              }""",
          """    init {
                  runCatching { connectivityManager.registerDefaultNetworkCallback(networkCallback) }
                  if (serverMode) {
                      db.makePendingMessagesRetryableNow()
                      refreshFailedMessages()
                      startServerSync()
                  }
              }"""
          )
          old = """        realtimeJob = viewModelScope.launch {
                      connectionState = if(networkAvailable) SyncConnectionState.CONNECTING else SyncConnectionState.OFFLINE
                      val forceFullSync = db.consumeForceFullSync()
                      val localCursor = if (forceFullSync) 0L else db.serverSyncCursor()
                      val bootstrapCursor=bootstrapServer(advanceCursor = localCursor == 0L)
                      if(localCursor>0L && bootstrapCursor!=null && bootstrapCursor>localCursor) catchUpServerEvents(localCursor, bootstrapCursor)
                      refreshPresence()
                      var failures=0
                      var pollCount=0
                      while (isActive && serverMode) {
                          if(!networkAvailable){ connectionState=SyncConnectionState.OFFLINE; delay(1_000); continue }
                          connectionState=SyncConnectionState.SYNCING
                          flushPendingServerMessages()
                          val token=db.serverToken(); val cursor=db.serverSyncCursor(); if(token.isBlank()) break
                          val result=runCatching { withContext(Dispatchers.IO) { api.poll(token,cursor,20) } }
                          result.onSuccess { poll ->
                              for(event in poll.events) handleRemoteEvent(event)
                              if(poll.cursor>cursor) db.setServerSyncCursor(poll.cursor)
                              failures=0; pollCount++; connectionState=SyncConnectionState.ONLINE
                              if(pollCount % 2 == 0) refreshPresence()
                          }.onFailure { error ->
                              if(error is ApiException && error.statusCode==401){ lastToast="Session expired. Please verify your number again."; db.clearServerSession(); db.setLoggedIn(false); screen=AppScreen.Login; return@launch }
                              failures++; connectionState=if(networkAvailable) SyncConnectionState.RETRYING else SyncConnectionState.OFFLINE
                              val backoff=(1_000L shl (failures-1).coerceIn(0,5)).coerceAtMost(30_000L); delay(backoff)
                          }
                      }
                  }"""
          new = """        realtimeJob = viewModelScope.launch {
                      connectionState = if(networkAvailable) SyncConnectionState.CONNECTING else SyncConnectionState.OFFLINE
                      val forceFullSync = db.consumeForceFullSync()
                      val localCursor = if (forceFullSync) 0L else db.serverSyncCursor()
                      if (networkAvailable) connectionState = SyncConnectionState.SYNCING
                      val bootstrapCursor=bootstrapServer(advanceCursor = localCursor == 0L)
                      if(localCursor>0L && bootstrapCursor!=null && bootstrapCursor>localCursor) catchUpServerEvents(localCursor, bootstrapCursor)
                      if (networkAvailable && serverMode && db.serverToken().isNotBlank()) connectionState = SyncConnectionState.ONLINE
                      refreshPresence()
                      var failures=0
                      var pollCount=0
                      while (isActive && serverMode) {
                          if(!networkAvailable){ connectionState=SyncConnectionState.OFFLINE; delay(1_000); continue }
                          if (failures == 0) connectionState = SyncConnectionState.ONLINE
                          flushPendingServerMessages()
                          val token=db.serverToken(); val cursor=db.serverSyncCursor(); if(token.isBlank()) break
                          val result=runCatching { withContext(Dispatchers.IO) { api.poll(token,cursor,20) } }
                          result.onSuccess { poll ->
                              for(event in poll.events) handleRemoteEvent(event)
                              if(poll.cursor>cursor) db.setServerSyncCursor(poll.cursor)
                              failures=0; pollCount++; connectionState=SyncConnectionState.ONLINE
                              if(pollCount % 2 == 0) refreshPresence()
                          }.onFailure { error ->
                              if(error is ApiException && error.statusCode==401){ lastToast="Session expired. Please verify your number again."; db.clearServerSession(); db.setLoggedIn(false); screen=AppScreen.Login; return@launch }
                              failures++; connectionState=if(networkAvailable) SyncConnectionState.RETRYING else SyncConnectionState.OFFLINE
                              val backoff=(1_000L shl (failures-1).coerceIn(0,5)).coerceAtMost(30_000L); delay(backoff)
                          }
                      }
                  }"""
          if old not in s:
              raise SystemExit("AppViewModel sync block not found")
          s = s.replace(old, new)
          vm.write_text(s)

          db = root / "app/src/main/java/com/example/messengerui/LocalMessengerDb.kt"
          s = db.read_text()
          old = """    fun retryMessageNow(localId: Long) {
                  writableDatabase.update("messages", ContentValues().apply { put("next_retry_at_ms", 0); putNull("last_error") }, "id=?", arrayOf(localId.toString()))
              }

              fun failedMessageIds(): List<Long> = readableDatabase.rawQuery("SELECT id FROM messages WHERE outgoing=1 AND status='SENDING' AND last_error IS NOT NULL", null).use { c -> buildList { while(c.moveToNext()) add(c.getLong(0)) } }"""
          new = """    fun retryMessageNow(localId: Long) {
                  writableDatabase.update("messages", ContentValues().apply { put("retry_count", 0); put("next_retry_at_ms", 0); putNull("last_error") }, "id=?", arrayOf(localId.toString()))
              }

              fun makePendingMessagesRetryableNow() {
                  writableDatabase.execSQL("UPDATE messages SET next_retry_at_ms=0 WHERE outgoing=1 AND status='SENDING' AND client_uuid IS NOT NULL")
              }

              fun failedMessageIds(): List<Long> = readableDatabase.rawQuery("SELECT id FROM messages WHERE outgoing=1 AND status='SENDING' AND last_error IS NOT NULL AND retry_count>=3", null).use { c -> buildList { while(c.moveToNext()) add(c.getLong(0)) } }"""
          if old not in s:
              raise SystemExit("LocalMessengerDb retry block not found")
          db.write_text(s.replace(old, new))

          build = root / "app/build.gradle.kts"
          s = build.read_text()
          s = s.replace("versionCode = 13", "versionCode = 14")
          s = s.replace('versionName = "2.2"', 'versionName = "2.3"')
          if 'create("stableDebug")' not in s:
              s = s.replace(
                  'android {\n    namespace = "com.example.messengerui"',
                  '''android {
    signingConfigs {
        create("stableDebug") {
            storeFile = rootProject.file("messenger-stable-debug.keystore")
            storePassword = "android"
            keyAlias = "androiddebugkey"
            keyPassword = "android"
        }
    }

    namespace = "com.example.messengerui"'''
              )
              s = s.replace(
                  '    buildFeatures {',
                  '''    buildTypes {
        getByName("debug") {
            signingConfig = signingConfigs.getByName("stableDebug")
        }
    }

    buildFeatures {'''
              )
          build.write_text(s)
          PY

          grep -q "makePendingMessagesRetryableNow" /tmp/messenger-build/messenger_live/app/src/main/java/com/example/messengerui/LocalMessengerDb.kt
          grep -q "if (failures == 0) connectionState = SyncConnectionState.ONLINE" /tmp/messenger-build/messenger_live/app/src/main/java/com/example/messengerui/AppViewModel.kt
          grep -q 'versionName = "2.3"' /tmp/messenger-build/messenger_live/app/build.gradle.kts
          grep -q 'create("stableDebug")' /tmp/messenger-build/messenger_live/app/build.gradle.kts

      - name: Build Messenger debug APK
        working-directory: /tmp/messenger-build/messenger_live
        run: gradle --no-daemon clean assembleDebug

      - name: Verify Messenger APK
        shell: bash
        run: |
          APK=/tmp/messenger-build/messenger_live/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$AAPT"
          test -x "$APKSIGNER"
          "$AAPT" dump badging "$APK" | tee messenger-send-sync-fix-apk-badging.txt
          grep -q "package: name='com.example.messengerui'" messenger-send-sync-fix-apk-badging.txt
          grep -q "versionName='2.3'" messenger-send-sync-fix-apk-badging.txt
          keytool -list -v -keystore /tmp/messenger-build/messenger_live/messenger-stable-debug.keystore -storepass android -alias androiddebugkey | tee messenger-stable-key.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee messenger-send-sync-fix-apksigner.txt
          cp "$APK" Messenger-Send-Sync-Regression-Fix-Stable.apk
          sha256sum Messenger-Send-Sync-Regression-Fix-Stable.apk | tee Messenger-Send-Sync-Regression-Fix-Stable.sha256

      - name: Upload Messenger debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Messenger-Send-Sync-Regression-Fix-Stable
          path: |
            Messenger-Send-Sync-Regression-Fix-Stable.apk
            Messenger-Send-Sync-Regression-Fix-Stable.sha256
            messenger-send-sync-fix-apk-badging.txt
            messenger-send-sync-fix-apksigner.txt
            messenger-stable-key.txt
          if-no-files-found: error
          retention-days: 1
