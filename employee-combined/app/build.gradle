plugins { id 'com.android.application' }

android {
    namespace 'com.alkeynes.employee.management'
    compileSdk 35

    defaultConfig {
        applicationId 'com.alkeynes.employee.management'
        minSdk 26
        targetSdk 35
        versionCode 2400
        versionName '2.4.0-test'
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
            versionNameSuffix ''
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
