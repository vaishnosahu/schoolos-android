name: Build Messenger UI Test APK

on:
  push:
    branches:
      - messenger-ui-build-temp

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Ensure Android SDK 36
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Reconstruct messenger source
        shell: bash
        run: |
          cat messenger-build/chunks/part* | base64 -d > messenger-build/MessengerAndroidUI.zip
          unzip -q messenger-build/MessengerAndroidUI.zip -d messenger-src
          test -f messenger-src/MessengerAndroidUI/settings.gradle.kts

      - name: Build installable debug APK
        working-directory: messenger-src/MessengerAndroidUI
        run: gradle --no-daemon clean assembleDebug

      - name: Verify and prepare APK
        shell: bash
        run: |
          APK="messenger-src/MessengerAndroidUI/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          cp "$APK" Messenger-UI-Test.apk
          sha256sum Messenger-UI-Test.apk > Messenger-UI-Test.sha256.txt
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$AAPT"
          "$AAPT" dump badging Messenger-UI-Test.apk | tee Messenger-UI-Test-badging.txt
          grep -q "package: name='com.example.messengerui'" Messenger-UI-Test-badging.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Messenger-UI-Test-APK
          path: |
            Messenger-UI-Test.apk
            Messenger-UI-Test.sha256.txt
            Messenger-UI-Test-badging.txt
          if-no-files-found: error
