          ! grep -R -q 'Profile photo picker placeholder' "$ROOT/app/src/main/java/com/example/messengerui"
          ! grep -R -q 'Help centre placeholder' "$ROOT/app/src/main/java/com/example/messengerui"
          grep -q 'messenger_push_dedupe_v2' "$ROOT/app/src/main/java/com/example/messengerui/NotificationRuntime.kt"
          grep -q 'cleanupLegacyChannels' "$ROOT/app/src/main/java/com/example/messengerui/NotificationHelper.kt"
          grep -q 'call-state:' "$ROOT/app/src/main/java/com/example/messengerui/AppViewModel.kt"
          grep -q 'calls/ice.php' "$ROOT/app/src/main/java/com/example/messengerui/ApiClient.kt"
          ! grep -q 'calls/config.php' "$ROOT/app/src/main/java/com/example/messengerui/ApiClient.kt"
          grep -q 'call.incoming' "$ROOT/app/src/main/java/com/example/messengerui/MessengerFirebaseService.kt"
          grep -q 'restartIceAndCreateOffer' "$ROOT/app/src/main/java/com/example/messengerui/WebRtcVoiceEngine.kt"
          grep -q 'statuses/feed.php' "$ROOT/app/src/main/java/com/example/messengerui/ApiClient.kt"
          grep -q 'groups/create.php' "$ROOT/app/src/main/java/com/example/messengerui/ApiClient.kt"
          ! grep -q 'ICE_RESTART_REQUEST' "$ROOT/app/src/main/java/com/example/messengerui/AppViewModel.kt"

      - name: Apply call foreground service 2.18 hardening
        shell: bash
        run: |
          python3 tmp-messenger-build/callfgs218_ci_patch.py
          ROOT=/tmp/messenger-build/messenger_live
