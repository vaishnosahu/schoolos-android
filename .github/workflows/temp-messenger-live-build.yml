name: Temporary Messenger Live APK Build

on:
  push:
    branches:
      - temp-messenger-live-build-20260930
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract Messenger source
        run: |
          mkdir -p /tmp/messenger-build
          unzip -q tmp-messenger-build/Messenger-Android-Live-API-Source.zip -d /tmp/messenger-build
          test -f /tmp/messenger-build/messenger_live/settings.gradle.kts

      - name: Build debug APK
        working-directory: /tmp/messenger-build/messenger_live
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          test -s /tmp/messenger-build/messenger_live/app/build/outputs/apk/debug/app-debug.apk
          sha256sum /tmp/messenger-build/messenger_live/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Messenger-Live-API-Debug-APK
          path: /tmp/messenger-build/messenger_live/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
