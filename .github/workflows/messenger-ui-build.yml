name: Build Messenger UI Test APK

on:
  push:
    branches:
      - messenger-ui-build-temp

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Ensure Android SDK 36
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ -d "$ANDROID_HOME/platforms/android-36" ]; then
            echo "Android 36 platform already present"
          else
            SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -1 || true)"
            test -n "$SDKMANAGER"
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            yes | "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" >/dev/null
          fi

      - name: Reconstruct messenger source
        shell: bash
        run: |
          cat messenger-build/chunks/part* | base64 -d > messenger-build/MessengerAndroidUI.zip
          unzip -tq messenger-build/MessengerAndroidUI.zip
          unzip -q messenger-build/MessengerAndroidUI.zip -d messenger-src
          test -f messenger-src/MessengerAndroidUI/settings.gradle.kts
          APP_GRADLE="messenger-src/MessengerAndroidUI/app/build.gradle.kts"
          sed -i 's/compose-bom:2026.08.00/compose-bom:2025.05.01/' "$APP_GRADLE"
          sed -i 's/core-ktx:1.19.0/core-ktx:1.16.0/' "$APP_GRADLE"
          sed -i 's/activity-compose:1.13.0/activity-compose:1.10.1/' "$APP_GRADLE"
          sed -i 's/lifecycle-viewmodel-compose:2.11.0/lifecycle-viewmodel-compose:2.9.0/' "$APP_GRADLE"
          sed -i 's/lifecycle-runtime-compose:2.11.0/lifecycle-runtime-compose:2.9.0/' "$APP_GRADLE"
          grep -E 'compose-bom|core-ktx|activity-compose|lifecycle-' "$APP_GRADLE"
          APP_SRC="messenger-src/MessengerAndroidUI/app/src/main/java/com/example/messengerui/MessengerApp.kt"
          sed -i 's/Icons\.Filled\.AddCall/Icons.Filled.Call/g' "$APP_SRC"
          sed -i '1i@file:OptIn(androidx.compose.material3.ExperimentalMaterial3Api::class)' "$APP_SRC"
          head -3 "$APP_SRC"

      - name: Build installable debug APK
        working-directory: messenger-src/MessengerAndroidUI
        run: gradle --no-daemon clean assembleDebug

      - name: Verify and prepare APK
        shell: bash
        run: |
          APK="messenger-src/MessengerAndroidUI/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          cp "$APK" Messenger-UI-Test.apk
          sha256sum Messenger-UI-Test.apk > Messenger-UI-Test.sha256.txt
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$AAPT"
          "$AAPT" dump badging Messenger-UI-Test.apk | tee Messenger-UI-Test-badging.txt
          grep -q "package: name='com.example.messengerui'" Messenger-UI-Test-badging.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Messenger-UI-Test-APK
          path: |
            Messenger-UI-Test.apk
            Messenger-UI-Test.sha256.txt
            Messenger-UI-Test-badging.txt
          if-no-files-found: error
