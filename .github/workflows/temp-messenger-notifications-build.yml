name: Messenger Video Calling 2.26 Build

on:
  push:
    branches: [ messenger-video226-20261002 ]

permissions:
  contents: read

jobs:
  messenger-notifications:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android API 36 using runner SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Reconstruct and verify Messenger source
        shell: bash
        run: |
          rm -rf /tmp/messenger-build
          mkdir -p /tmp/messenger-build
          cat tmp-messenger-build/notify-b64/part-* > /tmp/messenger-source.b64
          base64 --decode /tmp/messenger-source.b64 > /tmp/Messenger-Android-Notifications-Background-CI-Source.zip
          echo "d4b8ea54dae46c46e7dddcaaef02b86f01486592420077b51f130cf42e56dfec  /tmp/Messenger-Android-Notifications-Background-CI-Source.zip" | sha256sum -c -
          unzip -tq /tmp/Messenger-Android-Notifications-Background-CI-Source.zip
          unzip -q /tmp/Messenger-Android-Notifications-Background-CI-Source.zip -d /tmp/messenger-build
          test -f /tmp/messenger-build/messenger_live/settings.gradle.kts

      - name: Apply compile and send-sync regression closure
        shell: bash
        run: |
          find /tmp/messenger-build/messenger_live/app/src/main/java -name '*.kt' -type f -exec sed -i \
            -e 's/setNotificationsMessagesEnabled/updateNotificationsMessagesEnabled/g' \
            -e 's/setNotificationsGroupsEnabled/updateNotificationsGroupsEnabled/g' \
            -e 's/setNotificationsStatusEnabled/updateNotificationsStatusEnabled/g' \
            -e 's/setNotificationPreviewMode/updateNotificationPreviewMode/g' {} +

          python3 - <<'PY'
          from pathlib import Path

          root = Path("/tmp/messenger-build/messenger_live")
          vm = root / "app/src/main/java/com/example/messengerui/AppViewModel.kt"
          s = vm.read_text()
          s = s.replace(
          """    init {
                  runCatching { connectivityManager.registerDefaultNetworkCallback(networkCallback) }
                  if (serverMode) startServerSync()
              }""",
          """    init {
                  runCatching { connectivityManager.registerDefaultNetworkCallback(networkCallback) }
                  if (serverMode) {
                      db.makePendingMessagesRetryableNow()
                      refreshFailedMessages()
                      startServerSync()
                  }
              }"""
          )
          old = """        realtimeJob = viewModelScope.launch {
                      connectionState = if(networkAvailable) SyncConnectionState.CONNECTING else SyncConnectionState.OFFLINE
                      val forceFullSync = db.consumeForceFullSync()
                      val localCursor = if (forceFullSync) 0L else db.serverSyncCursor()
                      val bootstrapCursor=bootstrapServer(advanceCursor = localCursor == 0L)
                      if(localCursor>0L && bootstrapCursor!=null && bootstrapCursor>localCursor) catchUpServerEvents(localCursor, bootstrapCursor)
                      refreshPresence()
                      var failures=0
                      var pollCount=0
                      while (isActive && serverMode) {
                          if(!networkAvailable){ connectionState=SyncConnectionState.OFFLINE; delay(1_000); continue }
                          connectionState=SyncConnectionState.SYNCING
                          flushPendingServerMessages()
                          val token=db.serverToken(); val cursor=db.serverSyncCursor(); if(token.isBlank()) break
                          val result=runCatching { withContext(Dispatchers.IO) { api.poll(token,cursor,20) } }
                          result.onSuccess { poll ->
                              for(event in poll.events) handleRemoteEvent(event)
                              if(poll.cursor>cursor) db.setServerSyncCursor(poll.cursor)
                              failures=0; pollCount++; connectionState=SyncConnectionState.ONLINE
                              if(pollCount % 2 == 0) refreshPresence()
                          }.onFailure { error ->
                              if(error is ApiException && error.statusCode==401){ lastToast="Session expired. Please verify your number again."; db.clearServerSession(); db.setLoggedIn(false); screen=AppScreen.Login; return@launch }
                              failures++; connectionState=if(networkAvailable) SyncConnectionState.RETRYING else SyncConnectionState.OFFLINE
                              val backoff=(1_000L shl (failures-1).coerceIn(0,5)).coerceAtMost(30_000L); delay(backoff)
                          }
                      }
                  }"""
          new = """        realtimeJob = viewModelScope.launch {
                      connectionState = if(networkAvailable) SyncConnectionState.CONNECTING else SyncConnectionState.OFFLINE
                      val forceFullSync = db.consumeForceFullSync()
                      val localCursor = if (forceFullSync) 0L else db.serverSyncCursor()
                      if (networkAvailable) connectionState = SyncConnectionState.SYNCING
                      val bootstrapCursor=bootstrapServer(advanceCursor = localCursor == 0L)
                      if(localCursor>0L && bootstrapCursor!=null && bootstrapCursor>localCursor) catchUpServerEvents(localCursor, bootstrapCursor)
                      if (networkAvailable && serverMode && db.serverToken().isNotBlank()) connectionState = SyncConnectionState.ONLINE
                      refreshPresence()
                      var failures=0
                      var pollCount=0
                      while (isActive && serverMode) {
                          if(!networkAvailable){ connectionState=SyncConnectionState.OFFLINE; delay(1_000); continue }
                          if (failures == 0) connectionState = SyncConnectionState.ONLINE
                          flushPendingServerMessages()
                          val token=db.serverToken(); val cursor=db.serverSyncCursor(); if(token.isBlank()) break
                          val result=runCatching { withContext(Dispatchers.IO) { api.poll(token,cursor,20) } }
                          result.onSuccess { poll ->
                              for(event in poll.events) handleRemoteEvent(event)
                              if(poll.cursor>cursor) db.setServerSyncCursor(poll.cursor)
                              failures=0; pollCount++; connectionState=SyncConnectionState.ONLINE
                              if(pollCount % 2 == 0) refreshPresence()
                          }.onFailure { error ->
                              if(error is ApiException && error.statusCode==401){ lastToast="Session expired. Please verify your number again."; db.clearServerSession(); db.setLoggedIn(false); screen=AppScreen.Login; return@launch }
                              failures++; connectionState=if(networkAvailable) SyncConnectionState.RETRYING else SyncConnectionState.OFFLINE
                              val backoff=(1_000L shl (failures-1).coerceIn(0,5)).coerceAtMost(30_000L); delay(backoff)
                          }
                      }
                  }"""
          if old not in s:
              raise SystemExit("AppViewModel sync block not found")
          s = s.replace(old, new)
          s = s.replace(
              'val openNow = (screen as? AppScreen.ChatDetail)?.chatId == conversationId',
              'val openNow = NotificationRuntime.appVisible && NotificationRuntime.activeChatId == conversationId'
          )
          vm.write_text(s)

          db = root / "app/src/main/java/com/example/messengerui/LocalMessengerDb.kt"
          s = db.read_text()
          old = """    fun retryMessageNow(localId: Long) {
                  writableDatabase.update("messages", ContentValues().apply { put("next_retry_at_ms", 0); putNull("last_error") }, "id=?", arrayOf(localId.toString()))
              }

              fun failedMessageIds(): List<Long> = readableDatabase.rawQuery("SELECT id FROM messages WHERE outgoing=1 AND status='SENDING' AND last_error IS NOT NULL", null).use { c -> buildList { while(c.moveToNext()) add(c.getLong(0)) } }"""
          new = """    fun retryMessageNow(localId: Long) {
                  writableDatabase.update("messages", ContentValues().apply { put("retry_count", 0); put("next_retry_at_ms", 0); putNull("last_error") }, "id=?", arrayOf(localId.toString()))
              }

              fun makePendingMessagesRetryableNow() {
                  writableDatabase.execSQL("UPDATE messages SET next_retry_at_ms=0 WHERE outgoing=1 AND status='SENDING' AND client_uuid IS NOT NULL")
              }

              fun failedMessageIds(): List<Long> = readableDatabase.rawQuery("SELECT id FROM messages WHERE outgoing=1 AND status='SENDING' AND last_error IS NOT NULL AND retry_count>=3", null).use { c -> buildList { while(c.moveToNext()) add(c.getLong(0)) } }"""
          if old not in s:
              raise SystemExit("LocalMessengerDb retry block not found")
          db.write_text(s.replace(old, new))

          build = root / "app/build.gradle.kts"
          s = build.read_text()
          s = s.replace("versionCode = 13", "versionCode = 15")
          s = s.replace('versionName = "2.2"', 'versionName = "2.4"')
          build.write_text(s)
          PY

          grep -q "makePendingMessagesRetryableNow" /tmp/messenger-build/messenger_live/app/src/main/java/com/example/messengerui/LocalMessengerDb.kt
          grep -q "if (failures == 0) connectionState = SyncConnectionState.ONLINE" /tmp/messenger-build/messenger_live/app/src/main/java/com/example/messengerui/AppViewModel.kt
          grep -q 'versionName = "2.4"' /tmp/messenger-build/messenger_live/app/build.gradle.kts
          grep -q 'NotificationRuntime.appVisible && NotificationRuntime.activeChatId == conversationId' /tmp/messenger-build/messenger_live/app/src/main/java/com/example/messengerui/AppViewModel.kt


      - name: Apply Firebase live push closure
        shell: bash
        run: |
          python3 tmp-messenger-build/fcm25_ci_patch.py
          grep -q 'versionName = "2.5"' /tmp/messenger-build/messenger_live/app/build.gradle.kts
          grep -q 'FirebaseClientStore' /tmp/messenger-build/messenger_live/app/src/main/java/com/example/messengerui/PushRegistration.kt
          grep -q 'fun firebaseBootstrap' /tmp/messenger-build/messenger_live/app/src/main/java/com/example/messengerui/ApiClient.kt
          grep -q 'Firebase push status' /tmp/messenger-build/messenger_live/app/src/main/java/com/example/messengerui/MessengerApp.kt
          grep -q 'eventType == "push.test"' /tmp/messenger-build/messenger_live/app/src/main/java/com/example/messengerui/MessengerFirebaseService.kt


      - name: Apply realtime final acceptance closure
        shell: bash
        run: |
          python3 tmp-messenger-build/rt26_ci_patch.py
          grep -q 'versionName = "2.6"' /tmp/messenger-build/messenger_live/app/build.gradle.kts
          grep -q 'DB_VERSION = 9' /tmp/messenger-build/messenger_live/app/src/main/java/com/example/messengerui/LocalMessengerDb.kt
          grep -q 'receipt_queue' /tmp/messenger-build/messenger_live/app/src/main/java/com/example/messengerui/LocalMessengerDb.kt
          grep -q 'fun onAppForegrounded' /tmp/messenger-build/messenger_live/app/src/main/java/com/example/messengerui/AppViewModel.kt
          grep -q 'fun restartServerSync' /tmp/messenger-build/messenger_live/app/src/main/java/com/example/messengerui/AppViewModel.kt
          grep -q 'LocalLifecycleOwner' /tmp/messenger-build/messenger_live/app/src/main/java/com/example/messengerui/MessengerApp.kt


      - name: Apply groups status production closure
        shell: bash
        run: |
          cat tmp-messenger-build/gs27-patch/part-00.patch > /tmp/gs27.patch
          echo >> /tmp/gs27.patch
          tail -n +6 tmp-messenger-build/gs27-patch/part-01.patch >> /tmp/gs27.patch
          cat tmp-messenger-build/gs27-patch/part-02.patch tmp-messenger-build/gs27-patch/part-03.patch tmp-messenger-build/gs27-patch/part-04.patch >> /tmp/gs27.patch
          cd /tmp/messenger-build/messenger_live
          patch -p1 < /tmp/gs27.patch
          grep -q 'versionName = "2.7"' app/build.gradle.kts
          grep -q 'DB_VERSION = 10' app/src/main/java/com/example/messengerui/LocalMessengerDb.kt
          grep -q 'fun muteStatusOwner' app/src/main/java/com/example/messengerui/ApiClient.kt
          grep -q 'Status viewers' app/src/main/java/com/example/messengerui/MessengerApp.kt
          grep -q 'groupActionBusy' app/src/main/java/com/example/messengerui/AppViewModel.kt
          python3 "$GITHUB_WORKSPACE/tmp-messenger-build/gs27_compile_fix.py"
          grep -q 'parseStatusPayload' app/src/main/java/com/example/messengerui/ApiClient.kt


      - name: Apply media voice production hardening
        shell: bash
        run: |
          cat tmp-messenger-build/mv28-overlay/part-00a tmp-messenger-build/mv28-overlay/part-00b tmp-messenger-build/mv28-overlay/part-01 tmp-messenger-build/mv28-overlay/part-02a tmp-messenger-build/mv28-overlay/part-02b tmp-messenger-build/mv28-overlay/part-03 | tr -d '\r\n' > /tmp/mv28-overlay.b64
          base64 --decode /tmp/mv28-overlay.b64 > /tmp/mv28-overlay.zip
          echo "06dd8f6d6da9a63327e9df33fa7da2c07cd86fcc5acc0f1954b79b752d26ee0d  /tmp/mv28-overlay.zip" | sha256sum -c -
          unzip -tq /tmp/mv28-overlay.zip
          unzip -oq /tmp/mv28-overlay.zip -d /tmp/messenger-build/messenger_live
          grep -q 'versionName = "2.8"' /tmp/messenger-build/messenger_live/app/build.gradle.kts
          grep -q 'CACHE_SOFT_LIMIT_BYTES' /tmp/messenger-build/messenger_live/app/src/main/java/com/example/messengerui/TransferPolicy.kt
          grep -q 'createDownloadTarget(kind: MessageKind, mediaId: String' /tmp/messenger-build/messenger_live/app/src/main/java/com/example/messengerui/AttachmentStore.kt
          grep -q 'Range' /tmp/messenger-build/messenger_live/app/src/main/java/com/example/messengerui/ApiClient.kt
          grep -q 'fun pause()' /tmp/messenger-build/messenger_live/app/src/main/java/com/example/messengerui/VoiceNoteRecorder.kt
          grep -q 'cycleAudioPlaybackSpeed' /tmp/messenger-build/messenger_live/app/src/main/java/com/example/messengerui/AppViewModel.kt
          grep -q 'Clear downloaded media' /tmp/messenger-build/messenger_live/app/src/main/java/com/example/messengerui/MessengerApp.kt
          python3 "$GITHUB_WORKSPACE/tmp-messenger-build/mv28_compile_fix.py"
          grep -q 'formatVoiceRecordingDuration' /tmp/messenger-build/messenger_live/app/src/main/java/com/example/messengerui/MessengerApp.kt


      - name: Apply voice calling production foundation
        shell: bash
        run: |
          cd /tmp/messenger-build/messenger_live
          patch -p1 < "$GITHUB_WORKSPACE/tmp-messenger-build/call29.patch"
          grep -q 'versionName = "2.9"' app/build.gradle.kts
          grep -q 'io.github.webrtc-sdk:android:150.7871.01' app/build.gradle.kts
          grep -q 'class WebRtcVoiceEngine' app/src/main/java/com/example/messengerui/WebRtcVoiceEngine.kt
          grep -q 'fun startVoiceCall' app/src/main/java/com/example/messengerui/AppViewModel.kt
          grep -q 'eventType == "call.incoming"' app/src/main/java/com/example/messengerui/MessengerFirebaseService.kt
          grep -q 'FOREGROUND_SERVICE_MICROPHONE' app/src/main/AndroidManifest.xml
          python3 "$GITHUB_WORKSPACE/tmp-messenger-build/call29_quality_fix.py"
          grep -q 'rememberVoiceCallPermissionAction' app/src/main/java/com/example/messengerui/MessengerApp.kt
          ! grep -q 'Create call link' app/src/main/java/com/example/messengerui/MessengerApp.kt


      - name: Apply latest contacts phone stability forward fix
        shell: bash
        run: |
          python3 tmp-messenger-build/contact210_ci_patch.py
          grep -q 'versionName = "2.10"' /tmp/messenger-build/messenger_live/app/build.gradle.kts
          grep -q 'fun updatePhoneInput' /tmp/messenger-build/messenger_live/app/src/main/java/com/example/messengerui/AppViewModel.kt
          grep -q 'fun mergeServerContacts' /tmp/messenger-build/messenger_live/app/src/main/java/com/example/messengerui/LocalMessengerDb.kt
          grep -q 'parseJsonResponse' /tmp/messenger-build/messenger_live/app/src/main/java/com/example/messengerui/ApiClient.kt


      - name: Apply call 403 route fix
        shell: bash
        run: |
          python3 tmp-messenger-build/call403_ci_patch.py
          grep -q 'versionName = "2.11"' /tmp/messenger-build/messenger_live/app/build.gradle.kts
          grep -q 'calls/ice.php' /tmp/messenger-build/messenger_live/app/src/main/java/com/example/messengerui/ApiClient.kt
          ! grep -q 'calls/config.php' /tmp/messenger-build/messenger_live/app/src/main/java/com/example/messengerui/ApiClient.kt


      - name: Apply voice call UX audio routing hardening
        shell: bash
        run: |
          python3 tmp-messenger-build/voice212_ci_patch.py
          grep -q 'versionName = "2.12"' /tmp/messenger-build/messenger_live/app/build.gradle.kts
          grep -q 'versionCode = 23' /tmp/messenger-build/messenger_live/app/build.gradle.kts
          grep -q 'PROXIMITY_SCREEN_OFF_WAKE_LOCK' /tmp/messenger-build/messenger_live/app/src/main/java/com/example/messengerui/WebRtcVoiceEngine.kt
          grep -q 'Audio output' /tmp/messenger-build/messenger_live/app/src/main/java/com/example/messengerui/MessengerApp.kt
          grep -q 'voiceCallRoutes' /tmp/messenger-build/messenger_live/app/src/main/java/com/example/messengerui/AppViewModel.kt
          grep -q 'WAKE_LOCK' /tmp/messenger-build/messenger_live/app/src/main/AndroidManifest.xml


      - name: Apply network reconnect TURN reliability
        shell: bash
        run: |
          cat tmp-messenger-build/netturn213/part-00.patch tmp-messenger-build/netturn213/part-01.patch tmp-messenger-build/netturn213/part-02.patch tmp-messenger-build/netturn213/part-03.patch > /tmp/netturn213.patch
          cd /tmp/messenger-build/messenger_live
          patch -p1 < /tmp/netturn213.patch
          cp "$GITHUB_WORKSPACE/tmp-messenger-build/netturn213/WebRtcVoiceEngine.kt" app/src/main/java/com/example/messengerui/WebRtcVoiceEngine.kt
          grep -q 'versionName = "2.13"' app/build.gradle.kts
          grep -q 'versionCode = 24' app/build.gradle.kts
          grep -q 'restartIceAndCreateOffer' app/src/main/java/com/example/messengerui/WebRtcVoiceEngine.kt
          grep -q 'requestQualitySnapshot' app/src/main/java/com/example/messengerui/WebRtcVoiceEngine.kt
          grep -q 'callInitialOfferSent' app/src/main/java/com/example/messengerui/AppViewModel.kt
          grep -q 'Call diagnostics' app/src/main/java/com/example/messengerui/MessengerApp.kt


      - name: Apply incoming background call lifecycle hardening
        shell: bash
        run: |
          python3 tmp-messenger-build/incoming214_ci_patch.py
          grep -q 'versionName = "2.14"' /tmp/messenger-build/messenger_live/app/build.gradle.kts
          grep -q 'versionCode = 25' /tmp/messenger-build/messenger_live/app/build.gradle.kts
          grep -q 'CallNotificationActionReceiver' /tmp/messenger-build/messenger_live/app/src/main/AndroidManifest.xml
          grep -q 'calls_v2' /tmp/messenger-build/messenger_live/app/src/main/java/com/example/messengerui/NotificationHelper.kt
          grep -q 'call.accepted' /tmp/messenger-build/messenger_live/app/src/main/java/com/example/messengerui/MessengerFirebaseService.kt
          grep -q 'initialCallAction' /tmp/messenger-build/messenger_live/app/src/main/java/com/example/messengerui/MessengerApp.kt

      - name: Apply TURN relay and mobile handoff recovery hardening
        shell: bash
        run: |
          base64 --decode tmp-messenger-build/turnhandoff215.patch.b64 > /tmp/turnhandoff215.patch
          cd /tmp/messenger-build/messenger_live
          patch -p1 < /tmp/turnhandoff215.patch
          grep -q 'versionName = "2.15"' app/build.gradle.kts
          grep -q 'versionCode = 26' app/build.gradle.kts
          grep -q 'lastIncomingRecoveryAtMs' app/src/main/java/com/example/messengerui/AppViewModel.kt
          ! grep -q 'ICE_RESTART_REQUEST' app/src/main/java/com/example/messengerui/AppViewModel.kt
          grep -q 'iceGatheringComplete' app/src/main/java/com/example/messengerui/CallModels.kt
          grep -q 'Relay candidate ready' app/src/main/java/com/example/messengerui/MessengerApp.kt

      - name: Apply screen-off call and full-app stability hardening
        shell: bash
        run: |
          python3 tmp-messenger-build/callstatus216_ci_patch.py
          ROOT=/tmp/messenger-build/messenger_live
          grep -q 'versionName = "2.16"' "$ROOT/app/build.gradle.kts"
          grep -q 'versionCode = 27' "$ROOT/app/build.gradle.kts"
          grep -q 'calls_v3' "$ROOT/app/src/main/java/com/example/messengerui/NotificationHelper.kt"
          grep -q 'IncomingCallPush' "$ROOT/app/src/main/java/com/example/messengerui/MessengerFirebaseService.kt"
          grep -q 'ACTION_MANAGE_APP_USE_FULL_SCREEN_INTENT' "$ROOT/app/src/main/java/com/example/messengerui/AppViewModel.kt"
          grep -q 'Full-screen incoming calls' "$ROOT/app/src/main/java/com/example/messengerui/MessengerApp.kt"
          grep -q 'android:stopWithTask="false"' "$ROOT/app/src/main/AndroidManifest.xml"
          grep -q 'statuses/feed.php' "$ROOT/app/src/main/java/com/example/messengerui/ApiClient.kt"
          grep -q 'statuses/create.php' "$ROOT/app/src/main/java/com/example/messengerui/ApiClient.kt"
          grep -q 'statuses/view.php' "$ROOT/app/src/main/java/com/example/messengerui/ApiClient.kt"
          grep -q 'statuses/delete.php' "$ROOT/app/src/main/java/com/example/messengerui/ApiClient.kt"
          grep -q 'statuses/mute.php' "$ROOT/app/src/main/java/com/example/messengerui/ApiClient.kt"
          grep -q 'fun startVoiceCall' "$ROOT/app/src/main/java/com/example/messengerui/AppViewModel.kt"
          grep -q 'fun sendMessage' "$ROOT/app/src/main/java/com/example/messengerui/AppViewModel.kt"
          grep -q 'groupActionBusy' "$ROOT/app/src/main/java/com/example/messengerui/AppViewModel.kt"
          grep -q 'StatusStoryViewer' "$ROOT/app/src/main/java/com/example/messengerui/MediaPresentation.kt"
          grep -q 'restartIceAndCreateOffer' "$ROOT/app/src/main/java/com/example/messengerui/WebRtcVoiceEngine.kt"
          ! grep -q 'ICE_RESTART_REQUEST' "$ROOT/app/src/main/java/com/example/messengerui/AppViewModel.kt"

      - name: Apply canonical Messenger 2.17 consolidation
        shell: bash
        run: |
          python3 tmp-messenger-build/canonical217_ci_patch.py
          ROOT=/tmp/messenger-build/messenger_live
          grep -q 'versionName = "2.17"' "$ROOT/app/build.gradle.kts"
          grep -q 'versionCode = 28' "$ROOT/app/build.gradle.kts"
          grep -q 'DB_VERSION = 11' "$ROOT/app/src/main/java/com/example/messengerui/LocalMessengerDb.kt"
          ! grep -R -q 'DemoCall' "$ROOT/app/src/main/java/com/example/messengerui"
          ! grep -R -q 'ready for API integration' "$ROOT/app/src/main/java/com/example/messengerui"
          ! grep -R -q 'Profile photo picker placeholder' "$ROOT/app/src/main/java/com/example/messengerui"
          ! grep -R -q 'Help centre placeholder' "$ROOT/app/src/main/java/com/example/messengerui"
          grep -q 'messenger_push_dedupe_v2' "$ROOT/app/src/main/java/com/example/messengerui/NotificationRuntime.kt"
          grep -q 'cleanupLegacyChannels' "$ROOT/app/src/main/java/com/example/messengerui/NotificationHelper.kt"
          grep -q 'call-state:' "$ROOT/app/src/main/java/com/example/messengerui/AppViewModel.kt"
          grep -q 'calls/ice.php' "$ROOT/app/src/main/java/com/example/messengerui/ApiClient.kt"
          ! grep -q 'calls/config.php' "$ROOT/app/src/main/java/com/example/messengerui/ApiClient.kt"
          grep -q 'call.incoming' "$ROOT/app/src/main/java/com/example/messengerui/MessengerFirebaseService.kt"
          grep -q 'restartIceAndCreateOffer' "$ROOT/app/src/main/java/com/example/messengerui/WebRtcVoiceEngine.kt"
          grep -q 'statuses/feed.php' "$ROOT/app/src/main/java/com/example/messengerui/ApiClient.kt"
          grep -q 'groups/create.php' "$ROOT/app/src/main/java/com/example/messengerui/ApiClient.kt"
          ! grep -q 'ICE_RESTART_REQUEST' "$ROOT/app/src/main/java/com/example/messengerui/AppViewModel.kt"

      - name: Apply call foreground service 2.18 hardening
        shell: bash
        run: |
          python3 tmp-messenger-build/callfgs218_ci_patch.py
          ROOT=/tmp/messenger-build/messenger_live
