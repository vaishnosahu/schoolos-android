plugins { id 'com.android.application' }

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.google.android.material:material:1.12.0'
}

android {
    namespace 'com.schooloss.fullnative'
    compileSdk 35

    signingConfigs {
        preview {
            storeFile rootProject.file('schoolos-stable-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            enableV1Signing true
            enableV2Signing true
        }
    }

    defaultConfig {
        applicationId 'com.schooloss.fullnative'
        minSdk 24
        targetSdk 35
        versionCode 5000000
        versionName '5.0.0-full-native'
    }

    buildTypes {
        release { minifyEnabled false; shrinkResources false; signingConfig signingConfigs.preview }
        debug { signingConfig signingConfigs.preview; applicationIdSuffix '.debug'; versionNameSuffix '-debug' }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}