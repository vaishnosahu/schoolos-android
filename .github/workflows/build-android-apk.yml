name: Build SchoolOS Full Native R5
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build full native APK
        run: gradle --no-daemon clean assembleRelease
      - name: Verify APK contract
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          "$AAPT" dump permissions "$APK" | tee apk-permissions.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          grep -q "package: name='com.schooloss.fullnative'" apk-badging.txt
          grep -q "versionName='5.0.0-full-native'" apk-badging.txt
          grep -q "android.permission.INTERNET" apk-permissions.txt
          grep -q "android.permission.ACCESS_NETWORK_STATE" apk-permissions.txt
          if grep -E "CAMERA|RECORD_AUDIO|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|READ_CONTACTS|WRITE_EXTERNAL_STORAGE|READ_EXTERNAL_STORAGE" apk-permissions.txt; then exit 1; fi
          if grep -R "android.webkit.WebView\|androidx.webkit\|WebViewClient" app/src/main/java; then echo "::error::WebView reference found in application source"; exit 1; fi
          cp "$APK" SchoolOS-Full-Native-R5.apk
          sha256sum SchoolOS-Full-Native-R5.apk > apk-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SchoolOS-Full-Native-R5
          path: |
            SchoolOS-Full-Native-R5.apk
            apk-badging.txt
            apk-permissions.txt
            apk-signature.txt
            apk-sha256.txt
          if-no-files-found: error