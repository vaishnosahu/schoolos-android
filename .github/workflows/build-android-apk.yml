name: Build SchoolOS Native Mobile 3.0.1 APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon clean assembleDebug
      - name: Prepare artifact
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk SchoolOS-Native-Mobile-3.0.1.apk
          sha256sum SchoolOS-Native-Mobile-3.0.1.apk > SchoolOS-Native-Mobile-3.0.1.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: SchoolOS-Native-Mobile-3.0.1-APK
          path: |
            SchoolOS-Native-Mobile-3.0.1.apk
            SchoolOS-Native-Mobile-3.0.1.apk.sha256
          if-no-files-found: error
