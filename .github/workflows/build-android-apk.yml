name: Build SchoolOS Android 3.2.0 Signing Handoff
on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ release-3.2.0-production ]
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build unsigned production release
        run: gradle --no-daemon clean assembleRelease bundleRelease

      - name: Prepare secure local-signing handoff
        shell: bash
        run: |
          RELEASE_APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -1)"
          test -n "$RELEASE_APK"
          cp "$RELEASE_APK" schoolos-android-3.2.0-unsigned.apk

          test -f app/build/outputs/bundle/release/app-release.aab
          cp app/build/outputs/bundle/release/app-release.aab SchoolOS-Android-3.2.0-unsigned.aab

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          APKSIGNER_JAR="$(dirname "$APKSIGNER")/lib/apksigner.jar"
          test -f "$APKSIGNER_JAR"
          cp "$APKSIGNER_JAR" apksigner.jar

          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$AAPT"
          "$AAPT" dump badging "$RELEASE_APK" | tee apk-badging.txt
          "$AAPT" dump xmltree "$RELEASE_APK" AndroidManifest.xml | tee apk-manifest-tree.txt

          grep -q "package: name='com.schooloss.mobile'" apk-badging.txt
          grep -q "versionName='3.2.0'" apk-badging.txt
          grep -q "targetSdkVersion:'35'" apk-badging.txt
          if grep -qi "debuggable" apk-badging.txt; then
            echo "::error::Release APK unexpectedly reports debuggable state"
            exit 1
          fi

          sha256sum schoolos-android-3.2.0-unsigned.apk SchoolOS-Android-3.2.0-unsigned.aab > unsigned-sha256.txt
          printf 'unsigned-production-handoff\npackage=com.schooloss.mobile\nversion=3.2.0\ntargetSdk=35\n' > signing-state.txt

      - uses: actions/upload-artifact@v4
        with:
          name: SchoolOS-Android-3.2.0-Signing-Handoff
          path: |
            schoolos-android-3.2.0-unsigned.apk
            SchoolOS-Android-3.2.0-unsigned.aab
            apksigner.jar
            apk-badging.txt
            apk-manifest-tree.txt
            unsigned-sha256.txt
            signing-state.txt
          if-no-files-found: error
