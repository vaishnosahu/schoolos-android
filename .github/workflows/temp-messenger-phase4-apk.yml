name: Temporary Messenger Phase4 APK

on:
  push:
    branches:
      - temp-messenger-live-apk
    paths:
      - ".github/workflows/temp-messenger-phase4-apk.yml"
      - "messenger-build/phase4/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4

      - name: Reassemble verified Phase 3 baseline
        shell: bash
        run: |
          set -euo pipefail
          cat messenger-build/phase3/part*.b64 > /tmp/messenger-phase3.b64
          test "$(wc -c < /tmp/messenger-phase3.b64)" -eq 70908
          base64 --decode /tmp/messenger-phase3.b64 > /tmp/Messenger-Android-Media-Push-Source.zip
          echo "888036d4b7231482211335a001df2a956d50d9b4a63017e3a9a22b00cccdfa00  /tmp/Messenger-Android-Media-Push-Source.zip" | sha256sum -c -
          rm -rf "$GITHUB_WORKSPACE/build-input"
          mkdir -p "$GITHUB_WORKSPACE/build-input"
          unzip -q /tmp/Messenger-Android-Media-Push-Source.zip -d "$GITHUB_WORKSPACE/build-input"

      - name: Apply verified Phase 4 overlay
        shell: bash
        run: |
          set -euo pipefail
          cat             messenger-build/phase4/part00.b64             messenger-build/phase4/part01.b64             messenger-build/phase4/part02.b64             messenger-build/phase4/part03.b64             messenger-build/phase4/part04a.b64             messenger-build/phase4/part04b.b64             messenger-build/phase4/part05a.b64             messenger-build/phase4/part05b.b64             messenger-build/phase4/part06.b64             > /tmp/messenger-phase4-overlay.b64
          test "$(wc -c < /tmp/messenger-phase4-overlay.b64)" -eq 49472
          base64 --decode /tmp/messenger-phase4-overlay.b64 > /tmp/Messenger-Phase4-Android-Overlay.zip
          echo "d94358f4b8f96c0dfe9d7130e007e1471ba68df62502ca5d3329250e48bbf017  /tmp/Messenger-Phase4-Android-Overlay.zip" | sha256sum -c -
          unzip -qo /tmp/Messenger-Phase4-Android-Overlay.zip -d "$GITHUB_WORKSPACE/build-input"
          test -f "$GITHUB_WORKSPACE/build-input/app/build.gradle.kts"
          grep -q 'versionCode = 6' "$GITHUB_WORKSPACE/build-input/app/build.gradle.kts"
          grep -q 'versionName = "1.5"' "$GITHUB_WORKSPACE/build-input/app/build.gradle.kts"
          grep -q 'https://alkeynesprjects.com/messenger-api/api/v1/' "$GITHUB_WORKSPACE/build-input/app/src/main/java/com/example/messengerui/ApiConfig.kt"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build and verify Messenger Phase 4 APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$GITHUB_WORKSPACE/build-input" :app:assembleDebug --stacktrace
          APK="$GITHUB_WORKSPACE/build-input/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          OUT="$GITHUB_WORKSPACE/Messenger-Message-Actions-Debug.apk"
          cp "$APK" "$OUT"

          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$AAPT"
          test -x "$APKSIGNER"

          "$AAPT" dump badging "$OUT" | tee "$GITHUB_WORKSPACE/messenger-phase4-badging.txt"
          grep -q "package: name='com.example.messengerui'" "$GITHUB_WORKSPACE/messenger-phase4-badging.txt"
          grep -q "versionCode='6'" "$GITHUB_WORKSPACE/messenger-phase4-badging.txt"
          grep -q "versionName='1.5'" "$GITHUB_WORKSPACE/messenger-phase4-badging.txt"
          grep -q "application-label:'Messenger'" "$GITHUB_WORKSPACE/messenger-phase4-badging.txt"

          "$APKSIGNER" verify --verbose "$OUT" | tee "$GITHUB_WORKSPACE/messenger-phase4-signature.txt"
          sha256sum "$OUT" | tee "$GITHUB_WORKSPACE/Messenger-Message-Actions-Debug-SHA256.txt"

          DEX_STRINGS="$GITHUB_WORKSPACE/messenger-phase4-dex-strings.txt"
          unzip -p "$OUT" 'classes*.dex' | strings > "$DEX_STRINGS"
          grep -F 'https://alkeynesprjects.com/messenger-api/api/v1/' "$DEX_STRINGS" >/dev/null
          grep -F 'messages/edit.php' "$DEX_STRINGS" >/dev/null
          grep -F 'messages/delete.php' "$DEX_STRINGS" >/dev/null
          grep -F 'messages/react.php' "$DEX_STRINGS" >/dev/null
          grep -F 'messages/search.php' "$DEX_STRINGS" >/dev/null

      - name: Upload Messenger Phase 4 APK
        uses: actions/upload-artifact@v4
        with:
          name: Messenger-Message-Actions-Debug-APK
          path: |
            Messenger-Message-Actions-Debug.apk
            Messenger-Message-Actions-Debug-SHA256.txt
            messenger-phase4-badging.txt
            messenger-phase4-signature.txt
          if-no-files-found: error
          retention-days: 1
