name: Build Employee Management Native Live Map Pro v3.4 APK
on:
  push:
    branches: [ employee-management-native-parity-r2r3-v1 ]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Apply Native Parity R2/R3 source overlay
        shell: bash
        run: |
          set -euo pipefail
          test -f employee-combined/native-r2r3.patch.gz.b64
          base64 -d employee-combined/native-r2r3.patch.gz.b64 | gunzip > /tmp/native-r2r3.patch
          git apply --check /tmp/native-r2r3.patch
          git apply /tmp/native-r2r3.patch
          python - <<'PY'
          from pathlib import Path
          p=Path("employee-combined/app/src/main/java/com/alkeynes/employee/management/AdminOperations.java")
          s=p.read_text()
          s=s.replace('c.addView(ui.muted(x.optString("work_date")+" · "+shortTime(x.optString("effective_clock_in"))+" → "+(x.isNull("effective_clock_out")?"Open":shortTime(x.optString("effective_clock_out"))),ui.match(0,4,0,0));','c.addView(ui.muted(x.optString("work_date")+" · "+shortTime(x.optString("effective_clock_in"))+" → "+(x.isNull("effective_clock_out")?"Open":shortTime(x.optString("effective_clock_out")))),ui.match(0,4,0,0));')
          s=s.replace('card.addView(ui.muted("Ended "+(x.isNull("ended_at")?"Open":x.optString("ended_at")),ui.match(0,3,0,0));','card.addView(ui.muted("Ended "+(x.isNull("ended_at")?"Open":x.optString("ended_at"))),ui.match(0,3,0,0));')
          p.write_text(s)
          p=Path("employee-combined/app/src/main/java/com/alkeynes/employee/management/MainActivity.java")
          s=p.read_text()
          s=s.replace('c.addView(ui.muted(x.optString("start_date")+" → "+x.optString("end_date")+" · "+titleCase(x.optString("period_status")),ui.match(0,4,0,0));','c.addView(ui.muted(x.optString("start_date")+" → "+x.optString("end_date")+" · "+titleCase(x.optString("period_status"))),ui.match(0,4,0,0));')
          p.write_text(s)
          PY
          test -f employee-combined/native-live-map-v34.patch.gz.b64
          base64 -d employee-combined/native-live-map-v34.patch.gz.b64 | gunzip > /tmp/live-map-v34.patch
          git apply --check /tmp/live-map-v34.patch
          git apply /tmp/live-map-v34.patch
          grep -q "versionCode 3400" employee-combined/app/build.gradle
          grep -q "versionName '3.4.0-live-map-pro-test'" employee-combined/app/build.gradle
          grep -q 'switchLiveMapStyle("satellite")' employee-combined/app/src/main/java/com/alkeynes/employee/management/MainActivity.java
          grep -q "OfflineSyncJobService" employee-combined/app/src/main/AndroidManifest.xml
          test -f employee-combined/app/src/main/java/com/alkeynes/employee/management/OfflineAttendanceQueue.java
          test -f employee-combined/app/src/main/java/com/alkeynes/employee/management/OfflineSyncJobService.java
          test -f employee-combined/app/src/main/java/com/alkeynes/employee/management/CsvExporter.java
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build native Live Map Pro v3.4 APK
        working-directory: employee-combined
        run: gradle --no-daemon clean assembleDebug
      - name: Validate native Live Map Pro package, version and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="employee-combined/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" | tee native-live-map-v34-badging.txt
          grep -q "package: name='com.alkeynes.employee.management.nativeui'" native-live-map-v34-badging.txt
          grep -q "versionName='3.4.0-live-map-pro-test'" native-live-map-v34-badging.txt
          grep -q "targetSdkVersion:'35'" native-live-map-v34-badging.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee native-live-map-v34-signature.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" native-live-map-v34-signature.txt
          cp "$APK" Employee-Management-Native-LiveMap-Pro-v3.4.0.apk
          sha256sum Employee-Management-Native-LiveMap-Pro-v3.4.0.apk > Employee-Management-Native-LiveMap-Pro-v3.4.0.sha256
          rm -f employee-combined/native-r2r3.patch.gz.b64 employee-combined/native-live-map-v34.patch.gz.b64
          zip -qr Employee-Management-Native-LiveMap-Pro-Source-v3.4.0.zip employee-combined -x 'employee-combined/.gradle/*' 'employee-combined/app/build/*'
      - uses: actions/upload-artifact@v4
        with:
          name: Employee-Management-Native-LiveMap-Pro-v3.4.0
          path: |
            Employee-Management-Native-LiveMap-Pro-v3.4.0.apk
            Employee-Management-Native-LiveMap-Pro-v3.4.0.sha256
            Employee-Management-Native-LiveMap-Pro-Source-v3.4.0.zip
            native-live-map-v34-badging.txt
            native-live-map-v34-signature.txt
          if-no-files-found: error
