name: Temporary Messenger Notifications APK Build

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  messenger-notifications:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'temp-messenger-notifications-build-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android API 36 using runner SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Reconstruct and verify Messenger source
        shell: bash
        run: |
          rm -rf /tmp/messenger-build
          mkdir -p /tmp/messenger-build
          cat tmp-messenger-build/notify-b64/part-* > /tmp/messenger-source.b64
          base64 --decode /tmp/messenger-source.b64 > /tmp/Messenger-Android-Notifications-Background-CI-Source.zip
          echo "d4b8ea54dae46c46e7dddcaaef02b86f01486592420077b51f130cf42e56dfec  /tmp/Messenger-Android-Notifications-Background-CI-Source.zip" | sha256sum -c -
          unzip -tq /tmp/Messenger-Android-Notifications-Background-CI-Source.zip
          unzip -q /tmp/Messenger-Android-Notifications-Background-CI-Source.zip -d /tmp/messenger-build
          test -f /tmp/messenger-build/messenger_live/settings.gradle.kts

      - name: Build Messenger debug APK
        working-directory: /tmp/messenger-build/messenger_live
        run: gradle --no-daemon clean assembleDebug

      - name: Verify Messenger APK
        shell: bash
        run: |
          APK=/tmp/messenger-build/messenger_live/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$AAPT"
          test -x "$APKSIGNER"
          "$AAPT" dump badging "$APK" | tee messenger-notifications-apk-badging.txt
          grep -q "package: name='com.example.messengerui'" messenger-notifications-apk-badging.txt
          grep -q "versionName='2.2'" messenger-notifications-apk-badging.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee messenger-notifications-apksigner.txt
          cp "$APK" Messenger-Notifications-Background-Debug.apk
          sha256sum Messenger-Notifications-Background-Debug.apk | tee Messenger-Notifications-Background-Debug.sha256

      - name: Upload Messenger debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Messenger-Notifications-Background-Debug
          path: |
            Messenger-Notifications-Background-Debug.apk
            Messenger-Notifications-Background-Debug.sha256
            messenger-notifications-apk-badging.txt
            messenger-notifications-apksigner.txt
          if-no-files-found: error
          retention-days: 1
