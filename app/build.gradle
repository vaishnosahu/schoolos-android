plugins { id 'com.android.application' }

android {
    namespace 'com.schooloss.mobile'
    compileSdk 35
    defaultConfig {
        applicationId 'com.schooloss.mobile'
        minSdk 24
        targetSdk 35
        versionCode 20491012
        versionName '2.0.10'
    }
    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
