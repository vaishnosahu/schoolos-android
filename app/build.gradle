plugins { id 'com.android.application' }

dependencies {
    implementation 'androidx.core:core:1.15.0'
}

android {
    namespace 'com.schooloss.nativeapp'
    compileSdk 35

    signingConfigs {
        livePreview {
            storeFile rootProject.file('schoolos-stable-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            enableV1Signing true
            enableV2Signing true
        }
    }

    defaultConfig {
        applicationId 'com.schooloss.nativeapp'
        minSdk 24
        targetSdk 35
        versionCode 4000000
        versionName '4.0.0-live-r4'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.livePreview
        }
        debug {
            signingConfig signingConfigs.livePreview
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
