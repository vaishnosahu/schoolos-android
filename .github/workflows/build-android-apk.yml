name: Temporary Messenger Live APK Build
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  messenger:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'temp-messenger-live-build-20260930'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract Messenger source
        shell: bash
        run: |
          rm -rf /tmp/messenger-build
          mkdir -p /tmp/messenger-build
          unzip -q tmp-messenger-build/Messenger-Android-Live-API-Source.zip -d /tmp/messenger-build
          test -f /tmp/messenger-build/messenger_live/settings.gradle.kts

      - name: Build Messenger debug APK
        working-directory: /tmp/messenger-build/messenger_live
        run: gradle --no-daemon clean assembleDebug

      - name: Verify Messenger APK
        shell: bash
        run: |
          APK=/tmp/messenger-build/messenger_live/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | tee messenger-apk-badging.txt
          grep -q "package: name='com.example.messengerui'" messenger-apk-badging.txt
          grep -q "versionName='1.3'" messenger-apk-badging.txt
          cp "$APK" Messenger-Live-API-Test.apk
          sha256sum Messenger-Live-API-Test.apk > Messenger-Live-API-Test.sha256

      - name: Upload Messenger APK
        uses: actions/upload-artifact@v4
        with:
          name: Messenger-Live-API-Test
          path: |
            Messenger-Live-API-Test.apk
            Messenger-Live-API-Test.sha256
            messenger-apk-badging.txt
          if-no-files-found: error
          retention-days: 1
